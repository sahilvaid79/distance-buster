<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation Stats</title>
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#090914;
    --text:#fff8fb;
    --muted:#b9afc5;
    --pink:#ff6fae;
    --cyan:#6ee7f9;
  }
  html,body{
    margin:0;
    min-height:100%;
    font-family:Inter,system-ui,sans-serif;
    background:var(--bg);
    color:var(--text)
  }
  body:before,body:after{
    content:"";
    position:fixed;
    width:42vw;
    height:42vw;
    border-radius:50%;
    filter:blur(80px);
    opacity:.18;
    pointer-events:none;
    animation:orb 12s ease-in-out infinite alternate;
  }
  body:before{
    background:#ff3d9a;
    top:-12vw;
    left:-10vw
  }
  body:after{
    background:#635bff;
    bottom:-15vw;
    right:-10vw;
    animation-delay:-5s
  }
  @keyframes orb{
    to{transform:translate(8vw,5vh) scale(1.18)}
  }
  .container{
    position:relative;
    z-index:1;
    max-width:560px;
    margin:auto;
    padding:40px 20px
  }
  header{
    text-align:center;
    margin-bottom:30px
  }
  h1{
    font-size:2.5rem;
    margin:0 0 8px
  }
  .stat-box{
    padding:24px;
    border-radius:18px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,111,174,.3);
    margin-bottom:16px;
    text-align:center
  }
  .stat-number{
    font-size:3rem;
    font-weight:900;
    color:var(--pink);
    margin:12px 0
  }
  .stat-label{
    color:var(--muted);
    font-size:.95rem;
    font-weight:500
  }
  .button{
    display:inline-block;
    padding:12px 24px;
    border-radius:12px;
    background:linear-gradient(135deg,var(--pink),#9b7bff);
    color:#fff;
    text-decoration:none;
    font-weight:800;
    margin-top:20px;
    border:none;
    cursor:pointer;
    transition:.2s
  }
  .button:hover{
    transform:translateY(-2px)
  }
  .code{
    background:rgba(0,0,0,.3);
    padding:12px;
    border-radius:8px;
    font-family:monospace;
    font-size:.85rem;
    margin-top:8px;
    word-break:break-all
  }
  a{
    color:var(--cyan);
    text-decoration:none
  }
  a:hover{
    text-decoration:underline
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>📊 Invitation Analytics</h1>
    <p style="color:var(--muted)">Track invitation responses</p>
  </header>

  <div class="stat-box">
    <div class="stat-label">Total Accepts</div>
    <div class="stat-number" id="acceptCount">0</div>
  </div>

  <div class="stat-box">
    <div class="stat-label">Last Accept</div>
    <div id="lastAccept" style="color:var(--muted);font-size:.9rem;margin-top:12px">
      No accepts yet
    </div>
  </div>

  <div class="stat-box">
    <div class="stat-label">How it works</div>
    <p style="color:var(--muted);font-size:.9rem;margin:12px 0 0">
      Accept counts are stored in browser localStorage. Each time someone clicks "Yes, I'm in", it increments the counter with a timestamp.
    </p>
    <div class="code">localStorage.invitationAccepts</div>
  </div>

  <center>
    <a href="index.html" class="button">← Back to Invitation</a>
  </center>
</div>

<script>
function updateStats(){
  const count = parseInt(localStorage.getItem('invitationAccepts') || '0');
  const history = JSON.parse(localStorage.getItem('invitationHistory') || '[]');

  document.getElementById('acceptCount').textContent = count;

  if(history.length > 0){
    const lastEntry = history[history.length - 1];
    const date = new Date(lastEntry.timestamp);
    document.getElementById('lastAccept').innerHTML =
      `<strong>${lastEntry.time}</strong><br>` +
      `${date.toLocaleDateString()} ${date.toLocaleTimeString()}`;
  }
}

updateStats();

// Refresh every 2 seconds
setInterval(updateStats, 2000);
</script>

</body>
</html>
