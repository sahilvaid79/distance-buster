<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Good Morning ❤️</title><style>*{box-sizing:border-box}:root{--bg:#090914;--text:#fff8fb;--muted:#b9afc5;--pink:#ff6fae;--purple:#9b7bff;--cyan:#6ee7f9}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}body:before,body:after{content:"";position:fixed;width:42vw;height:42vw;border-radius:50%;filter:blur(80px);opacity:.18;pointer-events:none;animation:orb 12s ease-in-out infinite alternate}body:before{background:#ff3d9a;top:-12vw;left:-10vw}body:after{background:#635bff;bottom:-15vw;right:-10vw;animation-delay:-5s}@keyframes orb{to{transform:translate(8vw,5vh) scale(1.18)}}.app{position:relative;z-index:1;max-width:1050px;margin:auto;padding:35px 20px 60px}header{text-align:center;padding:35px 0}.eyebrow{font-size:.74rem;letter-spacing:.24em;text-transform:uppercase;color:var(--cyan);font-weight:800}h1{font-size:clamp(2.7rem,8vw,5.5rem);letter-spacing:-.06em;line-height:.95;margin:12px 0}.sub,p{color:var(--muted);line-height:1.65}.cards,.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}.card{min-height:300px;padding:30px;border-radius:30px;text-decoration:none;color:inherit;background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.045));border:1px solid rgba(255,255,255,.12);position:relative;transition:.25s}.card:hover{transform:translateY(-6px)}.icon{font-size:4rem}.card h2{font-size:2rem;margin:14px 0}.tag{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--pink);font-weight:900}.go{position:absolute;bottom:25px;padding:11px 17px;border-radius:999px;background:linear-gradient(135deg,var(--pink),var(--purple));font-weight:800}.back{color:var(--muted);text-decoration:none}.warning{color:#ff9ac6;font-weight:800}@media(max-width:700px){.cards,.grid{grid-template-columns:1fr}}.scene{width:min(720px,92vw);margin:7vh auto;padding:30px;border-radius:32px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}.timeline{max-width:560px;margin:25px auto}.msg{width:50%;padding:13px;opacity:0;transform:translateY(15px);transition:.6s}.show{opacity:1;transform:none}.right{margin-left:50%}.left{text-align:right}.bubble{display:inline-block;padding:12px 15px;border-radius:18px;background:rgba(255,111,174,.13)}.right .bubble{background:rgba(155,123,255,.15)}.angry{animation:shake .4s 3}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}.heart{display:block;margin:10px auto;border:0;background:none;font-size:4rem;opacity:0;pointer-events:none;cursor:pointer}.heart.ready{opacity:1;pointer-events:auto;animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.18)}}.heart.clicked{animation:fly 1s forwards}@keyframes fly{30%{transform:translateY(-15px) scale(1.4)}100%{transform:translateY(-80px);opacity:0}}.click,.morning{text-align:center;opacity:0;transition:1s}.click.show,.morning.show{opacity:1}.float{position:absolute;animation:up 1.8s forwards}@keyframes up{to{transform:translate(var(--x),-180px);opacity:0}}</style></head><body><main class="scene" id="scene"><a class="back" href="./">← apology department</a><header><h1>One tiny correction ❤️</h1><p>Because apparently one sentence was missing.</p></header><div class="timeline"><div class="msg left" id="m1"><span class="bubble">Her: Good night 🌙</span></div><div class="msg right" id="m2"><span class="bubble">Me: Good night ❤️</span></div><div class="msg left" id="m3"><span class="bubble angry"><b>Her: WHERE IS MY “I LOVE YOU”?! 😤</b></span></div><div class="msg right" id="m4"><span class="bubble">Me: Wait…</span></div></div><button class="heart" id="heart">❤️</button><div class="click" id="click">click on my heart ❤️</div><div class="morning" id="morning"><div style="font-size:3rem">☀️</div><h2>Good morning ❤️</h2><p>I didn't forget to say it.<br><b>It was just in my heart.</b></p></div></main><script>const ids=["m1","m2","m3","m4"];ids.forEach((x,i)=>setTimeout(()=>document.getElementById(x).classList.add("show"),600+i*1100));setTimeout(()=>{heart.classList.add("ready");click.classList.add("show")},4800);heart.onclick=()=>{if(heart.classList.contains("clicked"))return;heart.classList.add("clicked");click.textContent="there it is ❤️";for(let i=0;i<18;i++)setTimeout(()=>{let h=document.createElement("span");h.className="float";h.textContent=["❤️","💗","✨"][Math.floor(Math.random()*3)];h.style.left=(45+Math.random()*10)+"%";h.style.top="60%";h.style.setProperty("--x",(Math.random()*180-90)+"px");scene.appendChild(h);setTimeout(()=>h.remove(),1900)},i*70);setTimeout(()=>morning.classList.add("show"),850)};</script></body></html>
